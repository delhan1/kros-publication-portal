<h1 mat-dialog-title>{{ 'login.title' | translate }}</h1>
<mat-dialog-content>
  <form [formGroup]="loginForm" (ngSubmit)="submitHandler()" class="d-flex flex-column">
    <mat-form-field>
      <mat-label>{{ 'login.id' | translate }}</mat-label>
      <input matInput placeholder="{{ 'login.id' | translate }}" formControlName="id" required />

      <!-- input field error -->
      @if (idControl.invalid) {
        <mat-error>
          <span [hidden]="!idControl.errors?.['required']">
            {{ 'errors.thisFieldIsRequired' | translate }}
          </span>
        </mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" mat-button mat-dialog-close tabindex="-1">{{ 'common.cancel' | translate }}</button>
  <button
    type="submit"
    class="mat-spinner-button"
    matButton="filled"
    color="primary"
    [disabled]="loginForm.invalid"
    (click)="submitHandler()">
    {{ 'login.title' | translate }}
  </button>
</mat-dialog-actions>
