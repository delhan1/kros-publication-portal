<h1 mat-dialog-title>{{ data.titleKey | translate }}</h1>
<mat-dialog-content>
  <p>{{ data.messageKey | translate: { value: data.value } }}</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close tabindex="-1">{{ 'common.cancel' | translate }}</button>
  <button matButton="filled" mat-dialog-close="confirm" [color]="data.color" tabindex="2">
    {{ data.confirmKey | lowercase | translate }}
  </button>
</mat-dialog-actions>
